id: abpair-sweep1
keep_ready_minutes: 10
description: >
  Spends the unused delivery budget and closes two untested free variables. Seed curve
  1/3/8/16; human-only training (test is 100% human and mouse/rat rows score 0.06);
  per-seed marginal averaging vs logit averaging; head capacity/regularisation sweep;
  diverse-config blend. Incumbent OOF 0.5739, human 0.6067.
entrypoint: bash -lc "pip install -q 'transformers==4.44.2' 'tokenizers<0.20' rjieba sentencepiece pandas && python working/runs/sweep1/run.py"
dataset: abpair-public
compute:
  type: gpu
  profile: balanced
  min_vram_gb: 24
  preferred_gpu_models:
    - NVIDIA A10G
    - NVIDIA A10
    - NVIDIA RTX A5000
    - NVIDIA GeForce RTX 4090
    - NVIDIA A40
    - NVIDIA RTX A6000
  min_ram_gb: 32
  min_cpu_cores: 8
  workspace_gb: 50
  estimated_hours: 1.2
limits:
  max_runtime_hours: 2.0
  max_cost_usd: 2.5
artifacts:
  save:
    - metrics.json
